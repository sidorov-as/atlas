[pytest]
# Lives at the repo root, not core/backend/pyproject.toml (where this used to live) —
# deliberately, to fix a real bug: a fixture defined in one plugin's own `tests/conftest.py`
# could silently resolve for a *different* plugin's test with the same fixture name, with no
# error or warning (found when a `superuser_client` fixture added to
# `atlas_plugin_flows/tests/conftest.py` silently took over `atlas_plugin_standard_catalog`'s
# own `test_admin.py`, which defines and expects its *own* `superuser_client`).
#
# Root cause (found by reading pytest's own source, `_pytest/config/__init__.py`
# `Config._decide_args`): fixture ancestry ("closest conftest.py wins") is computed from
# nodeids/baseids expressed relative to `rootdir`. With this file at `core/backend/`,
# `rootdir` was `core/backend` — but `testpaths` (below) spans plugin directories that are
# siblings of `core/backend`, not descendants of it, so their nodeids/baseids only resolved
# to strings starting with `../`, and pytest's ancestry check breaks on `..`-laden paths.
# Rooting the ini file here, a real common ancestor of every testpath below, keeps every
# nodeid/baseid `..`-free and restores correct fixture scoping.
#
# Two things had to move together to make this safe, both found the same way (reading
# `Config._decide_args`, then confirming empirically):
# - `testpaths` is *only* consulted when pytest is invoked with its current directory equal
#   to `rootdir` — otherwise it's silently ignored and pytest falls back to recursively
#   collecting from the current directory instead (no warning). So tests must now be run
#   from the repo root (`cd <repo root> && pytest`), not from `core/backend` as before.
# - `DJANGO_SETTINGS_MODULE` needs `server` importable, which previously came for free from
#   running inside `core/backend`; `pythonpath` below puts `core/backend` on `sys.path`
#   explicitly so it still resolves when invoked from the repo root.
#
# A `--rootdir` passed via `addopts` does not work as a substitute for moving the file:
# pytest resolves rootdir, and from it which ini file (and therefore addopts) to load,
# together — too early for an ini-supplied `--rootdir` to change its own rootdir.
#
# `plugins/ingestion/backend/atlas_plugin_ingestion/tests/conftest.py` was quietly relying
# on this same leakage for its own `group` fixture (never defined its own, unlike every
# sibling plugin's conftest.py) — fixed alongside this, not a coincidence: anything else
# depending on cross-plugin fixture leakage would surface the same way now that it's gone.
DJANGO_SETTINGS_MODULE = server.settings
pythonpath =
    core/backend
    plugin-api/python
    plugins/auth-oidc/backend
    plugins/auth-gitea/backend
python_files = tests.py test_*.py
addopts = --strict-markers --strict-config
markers =
    e2e: needs Docker to run itself (distinct from `make ci`'s own throwaway
        PostgreSQL, which every backend test already assumes). Excluded from
        `make ci`'s pytest step via `-m "not e2e"`; CI's `backend-tests`
        workflow runs the full, unfiltered suite and still covers it.
testpaths =
    core/backend
    composer/atlas_composer
    plugin-api/python/atlas_plugin_api
    plugins/standard-catalog/backend/atlas_plugin_standard_catalog
    plugins/apis/backend/atlas_plugin_apis
    plugins/c4/backend/atlas_plugin_c4
    plugins/database-schema/backend/atlas_plugin_database_schema
    plugins/flows/backend/atlas_plugin_flows
    plugins/ingestion/backend/atlas_plugin_ingestion
    plugins/auth-oidc/backend/atlas_plugin_auth_oidc
    plugins/auth-gitea/backend/atlas_plugin_auth_gitea
