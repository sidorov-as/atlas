distribution: atlas.example.ingestion.gitea-primary@2026.09
core: 0.1.0
plugins:
  atlas.auth.gitea@0.1.0:
    backend:
      package: atlas-plugin-auth-gitea
      version: 0.1.0
    config:
      instanceOrigin: http://gitea.localhost:18092
      clientId: generated-by-runtime-bootstrap
      clientSecret:
        fromEnv: GITEA_CLIENT_SECRET
      scopes:
      - read:user
      oauthPkceEnabled: true
      allowedDestinations:
      - http://gitea.localhost:18092
      allowDevelopmentHttp: true
  atlas.standard-catalog@0.1.0:
    backend:
      package: atlas-plugin-standard-catalog
      version: 0.1.0
    frontend:
      package: '@atlas/plugin-standard-catalog'
      version: 0.1.0
  atlas.apis@0.1.0:
    backend:
      package: atlas-plugin-apis
      version: 0.1.0
    frontend:
      package: '@atlas/plugin-apis'
      version: 0.1.0
  atlas.c4@0.1.0:
    backend:
      package: atlas-plugin-c4
      version: 0.1.0
    frontend:
      package: '@atlas/plugin-c4'
      version: 0.1.0
  atlas.database-schema@0.1.0:
    backend:
      package: atlas-plugin-database-schema
      version: 0.1.0
    frontend:
      package: '@atlas/plugin-database-schema'
      version: 0.1.0
  atlas.ingestion@0.1.0:
    backend:
      package: atlas-plugin-ingestion
      version: 0.1.0
    config:
      sources:
      - id: gitea-primary
        baseUrl: http://gitea.localhost:18092
        authKind: bearer
        credential:
          fromEnv: GITEA_INGESTION_TOKEN
        allowDevelopmentHttp: true
  atlas.flows@0.1.0:
    backend:
      package: atlas-plugin-flows
      version: 0.1.0
    frontend:
      package: '@atlas/plugin-flows'
      version: 0.1.0
  atlas.mcp@0.1.0:
    backend:
      package: atlas-plugin-mcp
      version: 0.1.0
auth:
  providers:
  - id: atlas.auth.gitea
    owner: atlas.auth.gitea
    contractVersion: atlas.auth.providers.v1
    flowKind: redirect
    remoteLogout: unsupported
    presentation:
      displayName: Gitea
      credentialFields: []
    signup: disabled
    principalProvisioning: automatic
    actorProvisioning: automatic
    profileFields:
    - username
    - displayName
    groupSync:
      mode: none
      snapshotRequirement: unsupported
      maxAgeSeconds: 28800
      mappings: {}
    restrictedAttributes: []
    sourceBinding:
      sourceId: http://gitea.localhost:18092
      configurationFingerprint: atlas-example-gitea-1.27.3-v1
  default: atlas.auth.gitea
  sessionMaxAgeSeconds: 28800
  publicOrigin: http://localhost:18090
  trustedProxyAddresses: []
  adminPassword:
    mode: break-glass
    principalIds:
    - 1
  outboundTrust:
    allowedDestinations:
    - http://gitea.localhost:18092
    allowDevelopmentHttp: true
  passwordPolicy:
    minimumLength: 15
    maximumLength: 128
    rejectCommon: true
    rejectUserSimilarity: true
  recovery:
    mode: operator-managed
    verifiedAddressesRequired: true
    tokenMaxAgeSeconds: 3600
