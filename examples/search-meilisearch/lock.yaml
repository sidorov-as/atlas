auth:
  providers:
  - id: atlas.auth.local
    owner: atlas.catalog
    contractVersion: atlas.auth.providers.v1
    flowKind: credentials
    remoteLogout: unsupported
    presentation:
      displayName: Username and password
      credentialFields:
      - id: username
        label: Username
        kind: text
        autocomplete: username
      - id: password
        label: Password
        kind: secret
        autocomplete: current-password
    signup: disabled
    principalProvisioning: preprovisioned
    actorProvisioning: manual
    profileFields: []
    groupSync:
      mode: none
      snapshotRequirement: unsupported
      maxAgeSeconds: 28800
      mappings: {}
    restrictedAttributes: []
  default: atlas.auth.local
  sessionMaxAgeSeconds: 28800
  publicOrigin: http://localhost:8000
  trustedProxyAddresses: []
  adminPassword:
    mode: disabled
    principalIds: []
  outboundTrust:
    allowedDestinations: []
    allowDevelopmentHttp: false
  passwordPolicy:
    minimumLength: 15
    maximumLength: 128
    rejectCommon: true
    rejectUserSimilarity: true
  recovery:
    mode: operator-managed
    verifiedAddressesRequired: true
    tokenMaxAgeSeconds: 3600
services:
  atlas.search-meilisearch/meilisearch:
    plugin: atlas.search-meilisearch
    id: meilisearch
    image: getmeili/meilisearch:v1.12
    port: 7700
    healthCheck:
    - curl
    - -fsS
    - http://localhost:7700/health
    addressKey: url
    secretKey: key
    secretEnv: MEILI_MASTER_KEY
    secretFromEnv: ATLAS_SERVICE_MEILISEARCH_KEY
    dataPath: /meili_data
