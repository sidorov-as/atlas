# Base Atlas topology for the Meilisearch search example. The Meilisearch
# service, its volume, the access key and the `depends_on` entries come from
# `generated/compose.override.yaml`, which `COMPOSE_FILE` in `.env` merges in.
name: atlas-search-meilisearch

x-backend-environment: &backend-environment
  DJANGO_ENV: development
  DJANGO_SETTINGS_MODULE: server.settings
  DJANGO_DEBUG: "true"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?copy .env.example to .env}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:18100}
  DJANGO_DATABASE_HOST: postgres
  DJANGO_DATABASE_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-atlas_search_example}
  POSTGRES_USER: ${POSTGRES_USER:-atlas_search_example}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}

x-backend-build: &backend-build
  context: ../..
  dockerfile: core/backend/Dockerfile
  target: development

x-selected-plugins: &selected-plugins
  - ./generated/selected_plugins.py:/code/core/backend/server/settings/selected_plugins.py:ro

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas_search_example}
      POSTGRES_USER: ${POSTGRES_USER:-atlas_search_example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    volumes:
      - search-example-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [database]

  initializer:
    build: *backend-build
    environment:
      <<: *backend-environment
      ATLAS_BOOTSTRAP_USERNAME: ${ATLAS_BOOTSTRAP_USERNAME:-search-admin}
      ATLAS_BOOTSTRAP_EMAIL: ${ATLAS_BOOTSTRAP_EMAIL:-search-admin@example.test}
      ATLAS_BOOTSTRAP_GROUP: ${ATLAS_BOOTSTRAP_GROUP:-search-platform}
      ATLAS_BOOTSTRAP_PASSWORD: ${ATLAS_BOOTSTRAP_PASSWORD:?copy .env.example to .env}
    command:
      - /bin/sh
      - -ec
      - >-
        python manage.py migrate --noinput &&
        python manage.py seed_admin
        --username "$$ATLAS_BOOTSTRAP_USERNAME"
        --email "$$ATLAS_BOOTSTRAP_EMAIL"
        --group "$$ATLAS_BOOTSTRAP_GROUP"
    volumes: *selected-plugins
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database]
    restart: "no"

  backend:
    build: *backend-build
    environment: *backend-environment
    volumes: *selected-plugins
    depends_on:
      initializer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "/bin/sh /code/core/backend/docker/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [application, database]

  # Scheduler: drains pending search changes and fills the empty engine.
  ingestor:
    build: *backend-build
    environment: *backend-environment
    command: ["python", "manage.py", "runapscheduler"]
    volumes: *selected-plugins
    depends_on:
      initializer:
        condition: service_completed_successfully
    networks: [database]

  frontend:
    build:
      context: ../..
      dockerfile: core/frontend/Dockerfile
      target: development
    environment:
      VITE_BACKEND_URL: http://backend:8000
    ports:
      - "${ATLAS_PORT:-18100}:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks: [application]

networks:
  application:
  database:
    internal: true

volumes:
  search-example-postgres-data:
