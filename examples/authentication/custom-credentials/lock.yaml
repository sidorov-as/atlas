distribution: atlas.example.auth.custom-credentials@2026.09
core: 0.1.0
plugins:
  example.auth.fixture@0.1.0:
    backend:
      package: atlas-example-auth-fixture
      version: 0.1.0
    config:
      developmentEnabled: true
      sourceId: urn:atlas:directory:fixture-custom-credentials-example
      fixturePassword:
        fromEnv: ATLAS_FIXTURE_PASSWORD
  atlas.standard-catalog@0.1.0:
    backend:
      package: atlas-plugin-standard-catalog
      version: 0.1.0
    frontend:
      package: '@atlas/plugin-standard-catalog'
      version: 0.1.0
  atlas.apis@0.1.0:
    backend:
      package: atlas-plugin-apis
      version: 0.1.0
    frontend:
      package: '@atlas/plugin-apis'
      version: 0.1.0
  atlas.c4@0.1.0:
    backend:
      package: atlas-plugin-c4
      version: 0.1.0
    frontend:
      package: '@atlas/plugin-c4'
      version: 0.1.0
  atlas.database-schema@0.1.0:
    backend:
      package: atlas-plugin-database-schema
      version: 0.1.0
    frontend:
      package: '@atlas/plugin-database-schema'
      version: 0.1.0
  atlas.ingestion@0.1.0:
    backend:
      package: atlas-plugin-ingestion
      version: 0.1.0
  atlas.flows@0.1.0:
    backend:
      package: atlas-plugin-flows
      version: 0.1.0
    frontend:
      package: '@atlas/plugin-flows'
      version: 0.1.0
  atlas.mcp@0.1.0:
    backend:
      package: atlas-plugin-mcp
      version: 0.1.0
auth:
  providers:
  - id: example.auth.fixture
    owner: example.auth.fixture
    contractVersion: atlas.auth.providers.v1
    flowKind: credentials
    remoteLogout: unsupported
    presentation:
      displayName: Development fixture credentials
      credentialFields:
      - id: username
        label: Fixture username
        kind: text
        autocomplete: username
      - id: password
        label: Fixture password
        kind: secret
        autocomplete: current-password
    signup: disabled
    principalProvisioning: automatic
    actorProvisioning: automatic
    profileFields:
    - username
    - displayName
    - email
    groupSync:
      mode: exact
      snapshotRequirement: required
      maxAgeSeconds: 28800
      mappings:
        fixture-platform: custom-platform
    restrictedAttributes: []
    sourceBinding:
      sourceId: urn:atlas:directory:fixture-custom-credentials-example
      configurationFingerprint: atlas-example-fixture-v1
  - id: atlas.auth.local
    owner: atlas.catalog
    contractVersion: atlas.auth.providers.v1
    flowKind: credentials
    remoteLogout: unsupported
    presentation:
      displayName: Username and password
      credentialFields:
      - id: username
        label: Username
        kind: text
        autocomplete: username
      - id: password
        label: Password
        kind: secret
        autocomplete: current-password
    signup: disabled
    principalProvisioning: preprovisioned
    actorProvisioning: manual
    profileFields: []
    groupSync:
      mode: none
      snapshotRequirement: unsupported
      maxAgeSeconds: 28800
      mappings: {}
    restrictedAttributes: []
  default: example.auth.fixture
  sessionMaxAgeSeconds: 28800
  publicOrigin: http://localhost:18080
  trustedProxyAddresses: []
  adminPassword:
    mode: disabled
    principalIds: []
  outboundTrust:
    allowedDestinations: []
    allowDevelopmentHttp: true
  passwordPolicy:
    minimumLength: 15
    maximumLength: 128
    rejectCommon: true
    rejectUserSimilarity: true
  recovery:
    mode: operator-managed
    verifiedAddressesRequired: true
    tokenMaxAgeSeconds: 3600
