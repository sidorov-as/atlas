auth:
  providers:
  - id: example.auth.fixture
    owner: example.auth.fixture
    contractVersion: atlas.auth.providers.v1
    flowKind: credentials
    remoteLogout: unsupported
    presentation:
      displayName: Development fixture credentials
      credentialFields:
      - id: username
        label: Fixture username
        kind: text
        autocomplete: username
      - id: password
        label: Fixture password
        kind: secret
        autocomplete: current-password
    signup: disabled
    principalProvisioning: automatic
    actorProvisioning: automatic
    profileFields:
    - username
    - displayName
    - email
    groupSync:
      mode: exact
      snapshotRequirement: required
      maxAgeSeconds: 28800
      mappings:
        fixture-platform: custom-platform
    restrictedAttributes: []
    sourceBinding:
      sourceId: urn:atlas:directory:fixture-custom-credentials-example
      configurationFingerprint: atlas-example-fixture-v1
  - id: atlas.auth.local
    owner: atlas.catalog
    contractVersion: atlas.auth.providers.v1
    flowKind: credentials
    remoteLogout: unsupported
    presentation:
      displayName: Username and password
      credentialFields:
      - id: username
        label: Username
        kind: text
        autocomplete: username
      - id: password
        label: Password
        kind: secret
        autocomplete: current-password
    signup: disabled
    principalProvisioning: preprovisioned
    actorProvisioning: manual
    profileFields: []
    groupSync:
      mode: none
      snapshotRequirement: unsupported
      maxAgeSeconds: 28800
      mappings: {}
    restrictedAttributes: []
  default: example.auth.fixture
  sessionMaxAgeSeconds: 28800
  publicOrigin: http://localhost:18080
  trustedProxyAddresses: []
  adminPassword:
    mode: disabled
    principalIds: []
  outboundTrust:
    allowedDestinations: []
    allowDevelopmentHttp: true
  passwordPolicy:
    minimumLength: 15
    maximumLength: 128
    rejectCommon: true
    rejectUserSimilarity: true
  recovery:
    mode: operator-managed
    verifiedAddressesRequired: true
    tokenMaxAgeSeconds: 3600
