distribution: atlas.example.auth.oidc-keycloak@2026.09
core: 0.1.0
plugins:
  atlas.auth.oidc@0.1.0:
    backend:
      package: atlas-plugin-auth-oidc
      version: 0.1.0
    config:
      discoveryUrl: http://keycloak.localhost:18081/realms/atlas-example/.well-known/openid-configuration
      expectedIssuer: http://localhost:18081/realms/atlas-example
      clientId: atlas-example
      clientSecret:
        fromEnv: ATLAS_OIDC_CLIENT_SECRET
      scopes:
      - openid
      - profile
      - email
      - groups
      groupsClaim: groups
      allowedAlgorithms:
      - RS256
      allowedDestinations:
      - http://keycloak.localhost:18081
      - http://localhost:18081
      allowDevelopmentHttp: true
      remoteLogout: false
  atlas.standard-catalog@0.1.0:
    backend:
      package: atlas-plugin-standard-catalog
      version: 0.1.0
    frontend:
      package: '@atlas/plugin-standard-catalog'
      version: 0.1.0
  atlas.apis@0.1.0:
    backend:
      package: atlas-plugin-apis
      version: 0.1.0
    frontend:
      package: '@atlas/plugin-apis'
      version: 0.1.0
  atlas.c4@0.1.0:
    backend:
      package: atlas-plugin-c4
      version: 0.1.0
    frontend:
      package: '@atlas/plugin-c4'
      version: 0.1.0
  atlas.database-schema@0.1.0:
    backend:
      package: atlas-plugin-database-schema
      version: 0.1.0
    frontend:
      package: '@atlas/plugin-database-schema'
      version: 0.1.0
  atlas.ingestion@0.1.0:
    backend:
      package: atlas-plugin-ingestion
      version: 0.1.0
  atlas.flows@0.1.0:
    backend:
      package: atlas-plugin-flows
      version: 0.1.0
    frontend:
      package: '@atlas/plugin-flows'
      version: 0.1.0
  atlas.mcp@0.1.0:
    backend:
      package: atlas-plugin-mcp
      version: 0.1.0
auth:
  providers:
  - id: atlas.auth.oidc
    owner: atlas.auth.oidc
    contractVersion: atlas.auth.providers.v1
    flowKind: redirect
    remoteLogout: supported
    presentation:
      displayName: Single sign-on (OIDC)
      credentialFields: []
    signup: disabled
    principalProvisioning: automatic
    actorProvisioning: automatic
    profileFields:
    - username
    - displayName
    - email
    groupSync:
      mode: exact
      snapshotRequirement: required
      maxAgeSeconds: 28800
      mappings:
        atlas-platform: oidc-platform
        atlas-readers: oidc-readers
    restrictedAttributes: []
    sourceBinding:
      sourceId: http://localhost:18081/realms/atlas-example
      configurationFingerprint: atlas-example-keycloak-realm-v1
  default: atlas.auth.oidc
  sessionMaxAgeSeconds: 28800
  publicOrigin: http://localhost:18080
  trustedProxyAddresses: []
  adminPassword:
    mode: disabled
    principalIds: []
  outboundTrust:
    allowedDestinations:
    - http://keycloak.localhost:18081
    allowDevelopmentHttp: true
  passwordPolicy:
    minimumLength: 15
    maximumLength: 128
    rejectCommon: true
    rejectUserSimilarity: true
  recovery:
    mode: operator-managed
    verifiedAddressesRequired: true
    tokenMaxAgeSeconds: 3600
