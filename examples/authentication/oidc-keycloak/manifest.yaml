distribution:
  id: atlas.example.auth.oidc-keycloak
  version: "2026.09"

core:
  version: 0.1.0

auth:
  publicOrigin: http://localhost:18080
  trustedProxyAddresses: []
  sessionMaxAgeSeconds: 28800
  adminPassword:
    mode: disabled
  outboundTrust:
    allowedDestinations:
      - http://keycloak.localhost:18081
    allowDevelopmentHttp: true
  passwordPolicy:
    minimumLength: 15
    maximumLength: 128
    rejectCommon: true
    rejectUserSimilarity: true
  recovery:
    mode: operator-managed
  providers:
    - id: atlas.auth.oidc
      signup: disabled
      principalProvisioning: automatic
      actorProvisioning: automatic
      profileFields: [username, displayName, email]
      sourceBinding:
        sourceId: http://localhost:18081/realms/atlas-example
        configurationFingerprint: atlas-example-keycloak-realm-v1
      groupSync:
        mode: exact
        snapshotRequirement: required
        maxAgeSeconds: 28800
        mappings:
          atlas-platform: oidc-platform
          atlas-readers: oidc-readers
  default: atlas.auth.oidc

plugins:
  - id: atlas.auth.oidc
    version: 0.1.0
    backend:
      package: atlas-plugin-auth-oidc
      source: workspace
    config:
      discoveryUrl: http://keycloak.localhost:18081/realms/atlas-example/.well-known/openid-configuration
      expectedIssuer: http://localhost:18081/realms/atlas-example
      clientId: atlas-example
      clientSecret:
        fromEnv: ATLAS_OIDC_CLIENT_SECRET
      scopes: [openid, profile, email, groups]
      groupsClaim: groups
      allowedAlgorithms: [RS256]
      allowedDestinations:
        - http://keycloak.localhost:18081
        - http://localhost:18081
      allowDevelopmentHttp: true
      remoteLogout: false

  - id: atlas.standard-catalog
    version: 0.1.0
    backend:
      package: atlas-plugin-standard-catalog
      source: workspace
    frontend:
      package: "@atlas/plugin-standard-catalog"
      source: workspace

  - id: atlas.apis
    version: 0.1.0
    backend:
      package: atlas-plugin-apis
      source: workspace
    frontend:
      package: "@atlas/plugin-apis"
      source: workspace

  - id: atlas.c4
    version: 0.1.0
    backend:
      package: atlas-plugin-c4
      source: workspace
    frontend:
      package: "@atlas/plugin-c4"
      source: workspace

  - id: atlas.database-schema
    version: 0.1.0
    backend:
      package: atlas-plugin-database-schema
      source: workspace
    frontend:
      package: "@atlas/plugin-database-schema"
      source: workspace

  - id: atlas.ingestion
    version: 0.1.0
    backend:
      package: atlas-plugin-ingestion
      source: workspace

  - id: atlas.flows
    version: 0.1.0
    backend:
      package: atlas-plugin-flows
      source: workspace
    frontend:
      package: "@atlas/plugin-flows"
      source: workspace

  - id: atlas.mcp
    version: 0.1.0
    backend:
      package: atlas-plugin-mcp
      source: workspace
