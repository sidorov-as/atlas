distribution: atlas.example.auth.local@2026.09
core: 0.1.0
plugins:
  atlas.standard-catalog@0.1.0:
    backend:
      package: atlas-plugin-standard-catalog
      version: 0.1.0
    frontend:
      package: '@atlas/plugin-standard-catalog'
      version: 0.1.0
  atlas.apis@0.1.0:
    backend:
      package: atlas-plugin-apis
      version: 0.1.0
    frontend:
      package: '@atlas/plugin-apis'
      version: 0.1.0
  atlas.c4@0.1.0:
    backend:
      package: atlas-plugin-c4
      version: 0.1.0
    frontend:
      package: '@atlas/plugin-c4'
      version: 0.1.0
  atlas.database-schema@0.1.0:
    backend:
      package: atlas-plugin-database-schema
      version: 0.1.0
    frontend:
      package: '@atlas/plugin-database-schema'
      version: 0.1.0
  atlas.ingestion@0.1.0:
    backend:
      package: atlas-plugin-ingestion
      version: 0.1.0
  atlas.flows@0.1.0:
    backend:
      package: atlas-plugin-flows
      version: 0.1.0
    frontend:
      package: '@atlas/plugin-flows'
      version: 0.1.0
  atlas.mcp@0.1.0:
    backend:
      package: atlas-plugin-mcp
      version: 0.1.0
auth:
  providers:
  - id: atlas.auth.local
    owner: atlas.catalog
    contractVersion: atlas.auth.providers.v1
    flowKind: credentials
    remoteLogout: unsupported
    presentation:
      displayName: Username and password
      credentialFields:
      - id: username
        label: Username
        kind: text
        autocomplete: username
      - id: password
        label: Password
        kind: secret
        autocomplete: current-password
    signup: disabled
    principalProvisioning: preprovisioned
    actorProvisioning: manual
    profileFields: []
    groupSync:
      mode: none
      snapshotRequirement: unsupported
      maxAgeSeconds: 28800
      mappings: {}
    restrictedAttributes: []
  default: atlas.auth.local
  sessionMaxAgeSeconds: 28800
  publicOrigin: http://localhost:18080
  trustedProxyAddresses: []
  adminPassword:
    mode: disabled
    principalIds: []
  outboundTrust:
    allowedDestinations: []
    allowDevelopmentHttp: true
  passwordPolicy:
    minimumLength: 15
    maximumLength: 128
    rejectCommon: true
    rejectUserSimilarity: true
  recovery:
    mode: operator-managed
    verifiedAddressesRequired: true
    tokenMaxAgeSeconds: 3600
