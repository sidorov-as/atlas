APP_NAME = Atlas disposable Gitea OAuth2 example
RUN_MODE = prod
RUN_USER = git
WORK_PATH = /data/gitea

[server]
DOMAIN = gitea.localhost
ROOT_URL = http://gitea.localhost:18082/
HTTP_PORT = 18082
PROTOCOL = http

[database]
DB_TYPE = sqlite3
PATH = /data/gitea/gitea.db

[repository]
ROOT = /data/git/repositories

[security]
INSTALL_LOCK = true

[service]
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = false

[oauth2]
ENABLED = true

[log]
MODE = console
LEVEL = Info
