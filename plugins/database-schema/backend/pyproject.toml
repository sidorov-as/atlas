[project]
name = "atlas-plugin-database-schema"
description = "Atlas Database Schema plugin: the DatabaseSchema Facet, its SQL parser, and the ER Diagram view"
version = "0.1.0"
requires-python = "==3.13.13"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "atlas_plugin_database_schema" }]

[tool.poetry.dependencies]
python = "==3.13.13"
atlas-plugin-api-python = { path = "../../../plugin-api/python", develop = true }
django = ">=6.1,<6.2"
django-modern-rest = { version = "^0.14.0", extras = ["pydantic"] }
sqlglot = "^30.18.0"
