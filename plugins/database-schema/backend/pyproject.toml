[project]
name = "atlas-plugin-database-schema"
description = "Atlas Database Schema plugin: the DatabaseSchema Facet, its SQL parser, and the ER Diagram view"
version = "0.1.0"
requires-python = "==3.13.13"
dependencies = [
    "atlas-plugin-api-python",
    "django>=6.1,<6.2",
    "django-modern-rest[pydantic]>=0.14.0,<0.15.0",
    "sqlglot>=30.18.0,<31.0.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
atlas-plugin-api-python = { path = "../../../plugin-api/python", editable = true }
