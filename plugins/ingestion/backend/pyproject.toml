[project]
name = "atlas-plugin-ingestion"
description = "Atlas ingestion plugin: discovers catalog-info.yaml manifests and applies them through the core Entity Service"
version = "0.1.0"
requires-python = "==3.13.13"
dependencies = [
    "atlas-plugin-api-python",
    "django>=6.1,<6.2",
    "atlas-plugin-standard-catalog",
    "atlas-plugin-apis",
    "django-modern-rest[pydantic]>=0.14.0,<0.15.0",
    "django-apscheduler>=0.7,<0.8",
    "requests>=2.34,<3.0",
    "pyyaml>=6.0,<7.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
atlas-plugin-api-python = { path = "../../../plugin-api/python", editable = true }
atlas-plugin-standard-catalog = { path = "../../standard-catalog/backend", editable = true }
atlas-plugin-apis = { path = "../../apis/backend", editable = true }
