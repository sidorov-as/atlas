[project]
name = "atlas-plugin-standard-catalog"
description = "Atlas Standard Catalog plugin: System, Component, Resource, Team, and Actor"
version = "0.1.0"
requires-python = "==3.13.13"
dependencies = [
    "atlas-plugin-api-python",
    "django>=6.1,<6.2",
    "django-modern-rest[pydantic]>=0.14.0,<0.15.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
atlas-plugin-api-python = { path = "../../../plugin-api/python", editable = true }
