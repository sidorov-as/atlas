[project]
name = "atlas-plugin-apis"
description = "Atlas APIs plugin: the API Entity Kind, spec-source resolution, and its CRUD API"
version = "0.1.0"
requires-python = "==3.13.13"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "atlas_plugin_apis" }]

[tool.poetry.dependencies]
python = "==3.13.13"
atlas-plugin-api-python = { path = "../../../plugin-api/python", develop = true }
django = ">=6.1,<6.2"
django-modern-rest = { version = "^0.14.0", extras = ["pydantic"] }
requests = "^2.34"
pyyaml = "^6.0"
jsonpointer = "^3.0"
