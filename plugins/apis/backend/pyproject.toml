[project]
name = "atlas-plugin-apis"
description = "Atlas APIs plugin: the API Entity Kind, spec-source resolution, and its CRUD API"
version = "0.1.0"
requires-python = "==3.13.13"
dependencies = [
    "atlas-plugin-api-python",
    "django>=6.1,<6.2",
    "django-modern-rest[pydantic]>=0.14.0,<0.15.0",
    "requests>=2.34,<3.0",
    "pyyaml>=6.0,<7.0",
    "jsonpointer>=3.0,<4.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
atlas-plugin-api-python = { path = "../../../plugin-api/python", editable = true }
