[project]
name = "atlas-plugin-auth-oidc"
description = "First-party Atlas OpenID Connect authentication provider"
version = "0.1.0"
requires-python = "==3.13.13"
dependencies = [
    "atlas-plugin-api-python",
    "django>=6.1,<6.2",
    "pyjwt[crypto]>=2.0,<3",
    "requests>=2.34,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project.entry-points."atlas.plugins"]
"atlas.auth.oidc" = "atlas_plugin_auth_oidc.plugin:PLUGIN"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
target-version = "py313"
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.uv.sources]
atlas-plugin-api-python = { path = "../../../plugin-api/python", editable = true }
