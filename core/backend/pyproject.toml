[project]
name = "atlas-backend"
description = "Atlas software catalog backend"
version = "0.1.0"
requires-python = "==3.13.13"
readme = "README.md"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
atlas-composer = { path = "../../composer", develop = true }
atlas-plugin-api-python = { path = "../../plugin-api/python", develop = true }
atlas-plugin-apis = { path = "../../plugins/apis/backend", develop = true }
atlas-plugin-c4 = { path = "../../plugins/c4/backend", develop = true }
atlas-plugin-database-schema = { path = "../../plugins/database-schema/backend", develop = true }
atlas-plugin-flows = { path = "../../plugins/flows/backend", develop = true }
atlas-plugin-ingestion = { path = "../../plugins/ingestion/backend", develop = true }
atlas-plugin-standard-catalog = { path = "../../plugins/standard-catalog/backend", develop = true }
atlas-plugin-auth-oidc = { path = "../../plugins/auth-oidc/backend", develop = true }
atlas-plugin-auth-gitea = { path = "../../plugins/auth-gitea/backend", develop = true }
django = { version = ">=6.1,<6.2", extras = ["argon2"] }
django-allauth = { version = ">=65.19.1", extras = ["socialaccount"] }
django-cors-headers = "^4.0"
django-split-settings = "^1.3"
django-axes = "^8.0"
django-apscheduler = "^0.7"
django-csp = "^4.0"
django-health-check = "^4.5"
django-permissions-policy = "^4.31"
django-stubs-ext = "^6.0"
django-modern-rest = { version = "^0.14.0", extras = ["pydantic"] }
psycopg2-binary = "^2.9"
gunicorn = "^26.0"
python-decouple = "^3.8"
structlog = "^26.1"
pyyaml = "^6.0"
requests = "^2.34"
dulwich = "1.2.15"
paramiko = "5.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
pytest-django = "^4.9"
pytest-cov = "^7.1"
django-migration-linter = "^6.0"
django-safe-migrations = "^0.7"
django-extra-checks = "^0.17"
ruff = "^0.16"
mypy = "^1.19"
django-stubs = { version = ">=6.1,<6.2", extras = ["compatible-mypy"] }

# Pytest config (`[tool.pytest.ini_options]`) moved to `pytest.ini` at the repo root — a
# fixture-scoping bug (see that file's header comment) required `testpaths`' rootdir to be
# a real common ancestor of every plugin's tests, not this directory. Run tests from the
# repo root (`cd <repo root> && pytest`), not from here.

[tool.ruff]
target-version = "py313"
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

# django-split-settings' `include()` execs each settings file into a shared
# namespace, so names defined in an earlier-included file (e.g. `SECRET_KEY`
# in components/common.py) are genuinely available here at runtime — Ruff
# analyzes each file in isolation and can't see that, hence F821 false
# positives on environment-specific settings files.
[tool.ruff.lint.per-file-ignores]
"server/settings/environments/*.py" = ["F821"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "server.settings"
strict_settings = false

[tool.coverage.run]
branch = true
source = ["server"]
