[project]
name = "atlas-backend"
description = "Atlas software catalog backend"
version = "0.1.0"
requires-python = "==3.13.13"
readme = "README.md"
dependencies = [
    "atlas-composer",
    "atlas-plugin-api-python",
    "atlas-plugin-apis",
    "atlas-plugin-c4",
    "atlas-plugin-database-schema",
    "atlas-plugin-flows",
    "atlas-plugin-ingestion",
    "atlas-plugin-mcp",
    "atlas-plugin-search",
    "atlas-plugin-search-postgres",
    "atlas-plugin-search-meilisearch",
    "atlas-plugin-standard-catalog",
    "atlas-plugin-auth-oidc",
    "atlas-plugin-auth-gitea",
    "django[argon2]>=6.1,<6.2",
    "django-allauth[socialaccount]>=65.19.1",
    "django-cors-headers>=4.0,<5.0",
    "django-split-settings>=1.3,<2.0",
    "django-axes>=8.0,<9.0",
    "django-apscheduler>=0.7,<0.8",
    "django-csp>=4.0,<5.0",
    "django-health-check>=4.5,<5.0",
    "django-permissions-policy>=4.31,<5.0",
    "django-stubs-ext>=6.0,<7.0",
    "django-modern-rest[pydantic]>=0.14.0,<0.15.0",
    "psycopg2-binary>=2.9,<3.0",
    "gunicorn>=26.0,<27.0",
    "python-decouple>=3.8,<4.0",
    "structlog>=26.1,<27.0",
    "pyyaml>=6.0,<7.0",
    "requests>=2.34,<3.0",
    "dulwich==1.2.15",
    "paramiko==5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10.0",
    "pytest-django>=4.9,<5.0",
    "pytest-cov>=7.1,<8.0",
    "django-migration-linter>=6.0,<7.0",
    "django-safe-migrations>=0.7,<0.8",
    "django-extra-checks>=0.17,<0.18",
    "ruff>=0.16,<0.17",
    "mypy>=1.19,<2.0",
    "django-stubs[compatible-mypy]>=6.1,<6.2",
]

[tool.uv]
package = false

[tool.uv.sources]
atlas-composer = { path = "../../composer", editable = true }
atlas-plugin-api-python = { path = "../../plugin-api/python", editable = true }
atlas-plugin-apis = { path = "../../plugins/apis/backend", editable = true }
atlas-plugin-c4 = { path = "../../plugins/c4/backend", editable = true }
atlas-plugin-database-schema = { path = "../../plugins/database-schema/backend", editable = true }
atlas-plugin-flows = { path = "../../plugins/flows/backend", editable = true }
atlas-plugin-ingestion = { path = "../../plugins/ingestion/backend", editable = true }
atlas-plugin-mcp = { path = "../../plugins/mcp/backend", editable = true }
atlas-plugin-search = { path = "../../plugins/search/backend", editable = true }
atlas-plugin-search-postgres = { path = "../../plugins/search-postgres/backend", editable = true }
atlas-plugin-search-meilisearch = { path = "../../plugins/search-meilisearch/backend", editable = true }
atlas-plugin-standard-catalog = { path = "../../plugins/standard-catalog/backend", editable = true }
atlas-plugin-auth-oidc = { path = "../../plugins/auth-oidc/backend", editable = true }
atlas-plugin-auth-gitea = { path = "../../plugins/auth-gitea/backend", editable = true }

# Pytest config (`[tool.pytest.ini_options]`) moved to `pytest.ini` at the repo root — a
# fixture-scoping bug (see that file's header comment) required `testpaths`' rootdir to be
# a real common ancestor of every plugin's tests, not this directory. Run tests from the
# repo root (`cd <repo root> && pytest`), not from here.

[tool.ruff]
target-version = "py313"
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

# django-split-settings' `include()` execs each settings file into a shared
# namespace, so names defined in an earlier-included file (e.g. `SECRET_KEY`
# in components/common.py) are genuinely available here at runtime — Ruff
# analyzes each file in isolation and can't see that, hence F821 false
# positives on environment-specific settings files.
[tool.ruff.lint.per-file-ignores]
"server/settings/environments/*.py" = ["F821"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "server.settings"
strict_settings = false

[tool.coverage.run]
branch = true
source = ["server"]
