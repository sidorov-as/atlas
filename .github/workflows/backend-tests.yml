name: Backend tests

# No path filters, deliberately: this is meant to become a required status
# check, and a required check that's skipped by
# a path filter blocks merges on PRs that never trigger it. It runs on every
# pull request and every push to main instead.

on:
  pull_request: {}
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Full backend pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: atlas
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # Real instance for the Meilisearch adapter's conformance and
      # integration tests (plugins/search-meilisearch).
      meilisearch:
        image: getmeili/meilisearch:v1.12
        env:
          MEILI_MASTER_KEY: ci-meilisearch-key
          MEILI_ENV: development
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700
        options: >-
          --health-cmd "curl -fsS http://localhost:7700/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up backend environment
        # `atlas-backend`'s pyproject.toml pulls in composer, plugin-api/python,
        # and every plugin backend as editable path dependencies, so this
        # single `uv sync` covers all of them.
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.13.13"
          working-directory: core/backend

      - name: Run full backend test suite
        # The repo-root `pytest.ini` fans this one invocation out across
        # core/backend, composer, plugin-api/python, and every plugin
        # backend's own tests/ (see its `testpaths`) — but only when pytest
        # runs with cwd == rootdir (repo root), per that file's own header
        # comment. `--project core/backend` points uv at the environment just
        # synced without changing the working directory.
        env:
          ATLAS_TEST_MEILISEARCH_URL: http://localhost:7700
          ATLAS_TEST_MEILISEARCH_KEY: ci-meilisearch-key
          # CI must exercise the real instance, never silently skip it.
          ATLAS_REQUIRE_MEILISEARCH: "1"
        run: uv run --project core/backend pytest
