name: Backend tests

# No path filters, deliberately: this is meant to become a required status
# check, and a required check that's skipped by
# a path filter blocks merges on PRs that never trigger it. It runs on every
# pull request and every push to main instead.

on:
  pull_request: {}
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Full backend pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: atlas
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.13"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install backend dependencies
        # `atlas-backend`'s pyproject.toml pulls in composer, plugin-api/python,
        # and every plugin backend as develop-mode path dependencies, so this
        # single install covers all of them.
        working-directory: core/backend
        run: poetry install

      - name: Run full backend test suite
        # The repo-root `pytest.ini` fans this one invocation out across
        # core/backend, composer, plugin-api/python, and every plugin
        # backend's own tests/ (see its `testpaths`) — but only when pytest
        # runs with cwd == rootdir (repo root), per that file's own header
        # comment. `-P core/backend` points Poetry at the environment just
        # installed without changing the working directory.
        run: poetry -P core/backend run pytest
