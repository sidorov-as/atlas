name: Dependency audit

# No path filters, deliberately: the frontend half of this is meant to
# become a required status check once
# the frontend dependency vulnerabilities are fixed, and
# a required check that's skipped by a path filter blocks merges on PRs that
# never trigger it. It runs on every pull request and every push to main
# instead.

on:
  pull_request: {}
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Audit frontend dependencies
        # Reads package-lock.json directly, which already spans the whole
        # npm workspace (core/frontend, plugin-api/typescript, and every
        # plugins/*/frontend package) — no install needed.
        run: npm audit --audit-level=high

  pip-audit:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up backend environment
        # atlas-backend's pyproject.toml pulls in composer, plugin-api/python,
        # and every plugin backend as editable path dependencies, so the
        # resulting environment's third-party packages cover all of them.
        # `uv sync`'s default in-project venv puts that environment at
        # core/backend/.venv, same location as before.
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.13.13"
          working-directory: core/backend

      - name: Install pip into the venv
        # uv-created venvs ship without pip, and pip-audit shells out to
        # `<venv>/bin/python -m pip`.
        run: uv pip install --python core/backend/.venv/bin/python pip

      - name: Audit Python dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          virtual-environment: core/backend/.venv
          # CVE-2026-49265: oauthlib PKCE `code_challenge_method_plain` uses a
          # non-constant-time comparison (timing side channel). Fixed in
          # oauthlib 4.0.0, but django-allauth[socialaccount] (our only
          # consumer of oauthlib, via auth-oidc/auth-gitea) pins
          # `oauthlib (>=3.3.0,<4)` as of the latest release (65.19.5), so we
          # can't take the fix yet. Re-check when django-allauth relaxes that
          # constraint and drop this line.
          ignore-vulns: CVE-2026-49265
