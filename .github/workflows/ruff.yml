name: Ruff

# No path filters, deliberately: this is meant to become a required status
# check, and a required check that's skipped by
# a path filter blocks merges on PRs that never trigger it. It runs on every
# pull request and every push to main instead.
#
# Meant to become a required status check (branch protection) once every
# package below is actually clean.

on:
  pull_request: {}
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ruff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    # `.github/ruff-packages.txt` is the single source of truth for the
    # package list, shared with the root `Makefile`'s `RUFF_PACKAGES`
    # (`make ci`/`make format`/`make format-check` read the same file) — a
    # matrix can't read a file directly, so this job turns it into JSON once
    # for the `ruff` job below to consume.
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: packages
        run: |
          packages=$(jq -R -s -c 'split("\n") | map(select(length > 0))' .github/ruff-packages.txt)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  ruff:
    needs: discover
    name: ruff check / ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run ruff check
        # Each package's own pyproject.toml supplies its own [tool.ruff]
        # config (or ruff's built-in defaults, for the packages that don't
        # customize it) — ruff-action searches upward from `src` for it.
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          src: ${{ matrix.package }}
