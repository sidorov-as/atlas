name: Secret scan

# No path filters, deliberately: this is meant to become a required status
# check, and a required check that's skipped by
# a path filter blocks merges on PRs that never trigger it. It runs on every
# pull request and every push to main instead.

on:
  pull_request: {}
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # gitleaks-action needs the actual commit range of the push/PR to
          # scan just its diff, not a shallow single-commit checkout.
          fetch-depth: 0

      - name: Scan the PR's diff for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
