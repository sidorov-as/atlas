name: Authentication example integration

on:
  pull_request:
    paths:
      - "examples/authentication/**"
      - "composer/**"
      - "plugin-api/python/**"
      - "plugins/auth-*/**"
      - "plugins/standard-catalog/**"
      - "core/backend/**"
      - "core/frontend/**"
      - ".github/workflows/authentication-examples-integration.yml"
  push:
    branches: ["main"]
    paths:
      - "examples/authentication/**"
      - "composer/**"
      - "plugin-api/python/**"
      - "plugins/auth-*/**"
      - "plugins/standard-catalog/**"
      - "core/backend/**"
      - "core/frontend/**"
      - ".github/workflows/authentication-examples-integration.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: authentication-examples-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Release browser gate / ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        example:
          - local
          - oidc-keycloak
          - oauth2-gitea
          - custom-credentials
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Mask disposable fixture values
        working-directory: examples/authentication/${{ matrix.example }}
        shell: bash
        run: |
          while IFS='=' read -r name value; do
            case "$name" in
              *PASSWORD*|*SECRET*|*TOKEN*|*PRIVATE_KEY*|*CREDENTIAL*)
                test -z "$value" || echo "::add-mask::$value"
                ;;
            esac
          done < .env.example

      - name: Start topology
        working-directory: examples/authentication/${{ matrix.example }}
        run: >-
          docker compose --env-file .env.example up --build --detach --wait
          --wait-timeout 300

      - name: Run topology smoke test
        run: >-
          python3 examples/authentication/ci.py run
          --example examples/authentication/${{ matrix.example }}
          --env-file .env.example
          --output artifacts/${{ matrix.example }}/smoke.txt

      - name: Collect redacted diagnostics
        if: always()
        run: >-
          python3 examples/authentication/ci.py collect
          --example examples/authentication/${{ matrix.example }}
          --env-file .env.example
          --output artifacts/${{ matrix.example }}

      - name: Stop topology
        if: always()
        working-directory: examples/authentication/${{ matrix.example }}
        run: docker compose --env-file .env.example down --volumes --remove-orphans

      - name: Upload redacted diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authentication-${{ matrix.example }}-diagnostics
          path: artifacts/${{ matrix.example }}/
          if-no-files-found: error
          retention-days: 7

  security-negative-journeys:
    name: Release security-negative gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: atlas
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.13"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install backend release-test dependencies
        working-directory: core/backend
        run: poetry install

      - name: Run authentication security-negative journeys
        working-directory: core/backend
        run: >-
          poetry run pytest -q
          server/apps/catalog/tests/test_auth_hardening.py::test_admin_password_login_defaults_to_disabled
          server/apps/catalog/tests/test_auth_hardening.py::test_break_glass_rejects_unlisted_or_inactive_staff
          server/apps/catalog/tests/test_auth_security.py::test_inactive_principal_is_rejected_on_the_next_session_request
          server/apps/catalog/tests/test_provisioning.py::test_source_fingerprint_change_requires_reviewed_migration
          server/apps/catalog/tests/test_provisioning.py::test_restricted_policy_rejects_unverified_email_without_creating_state
          server/apps/catalog/tests/test_provisioning.py::test_incomplete_exact_snapshot_rolls_back_and_failure_event_survives
          server/apps/catalog/tests/test_provisioning.py::test_concurrent_first_login_creates_one_identity_and_actor
          server/apps/catalog/tests/test_membership_grants.py::test_legacy_oidc_grant_can_transfer_without_residual_manual_access
          server/apps/catalog/tests/test_membership_grant_migration.py
