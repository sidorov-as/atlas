description = "Atlas documentation site"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "zensical>=0.0.46",
    "mkdocstrings[python]>=1.0.1",
    "mkdocs-autorefs>=1.4.3",
]

[tool.uv]
package = false
